name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: npm audit (fails on high or critical)
        run: npm audit --audit-level=high --omit=dev
      - name: Docker image builds
        run: docker build -t time-service-ci .
